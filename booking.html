<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Ticket Booking</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  color:#fff;
}
.card{
  background:#111;
  padding:25px;
  width:100%;
  max-width:420px;
  border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}
h2{text-align:center;margin-bottom:20px}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}
input,select{background:#222;color:#fff}
button{
  background:#00e676;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.price{
  margin-top:15px;
  text-align:center;
  color:#00ff99;
}
</style>
</head>

<body>

<div class="card">
  <h2>🎟 Movie Ticket</h2>

  <input type="email" id="email" placeholder="Enter email">

  <select id="seats">
    <option value="1">1 Seat</option>
    <option value="2">2 Seats</option>
    <option value="3">3 Seats</option>
    <option value="4">4 Seats</option>
  </select>

  <div class="price">
    Total: ₹<span id="amount">100</span>
  </div>

  <button id="payBtn">Pay Now</button>
</div>

<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const cashfree = Cashfree({ mode: "production" });

  const seats = document.getElementById("seats");
  const amountEl = document.getElementById("amount");
  const payBtn = document.getElementById("payBtn");

  seats.addEventListener("change", () => {
    amountEl.innerText = seats.value * 100;
  });

  payBtn.addEventListener("click", async () => {

    const email = document.getElementById("email").value;
    const amount = seats.value * 100;

    if (!email) {
      alert("Enter email");
      return;
    }

    try {
      const res = await fetch(
        "https://district-movie-ticket-r-backend-1.onrender.com/create-order",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: amount,
            email: email,
            phone: "9999999999"
          })
        }
      );

      const data = await res.json();
      console.log("BACKEND RESPONSE:", data);

      if (!data.payment_session_id) {
        alert("Payment session not created");
        return;
      }

      // ✅ FINAL FIX HERE
      cashfree.pay({
        paymentSessionId: data.payment_session_id,
        redirectTarget: "_self"
      });

    } catch (err) {
      console.error(err);
      alert("Payment failed to start");
    }

  });

});
</script>

</body>
</html>
