<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Movie Ticket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background:#0f172a;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial;
      color:#fff;
    }
    .box {
      background:#111827;
      padding:25px;
      width:100%;
      max-width:400px;
      border-radius:12px;
    }
    input,select,button {
      width:100%;
      margin-top:10px;
      padding:10px;
      border-radius:6px;
      border:none;
    }
    button {
      background:#22c55e;
      color:#000;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🎟 Movie Ticket</h2>

  <input type="email" id="email" placeholder="Email">
  <select id="seats">
    <option value="1">1 Seat</option>
    <option value="2">2 Seats</option>
    <option value="3">3 Seats</option>
    <option value="4">4 Seats</option>
  </select>

  <p>Total: ₹<span id="amt">100</span></p>

  <button id="payBtn">Pay Now</button>
</div>

<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const cashfree = Cashfree({ mode: "production" });

  const seats = document.getElementById("seats");
  const amt = document.getElementById("amt");
  const btn = document.getElementById("payBtn");

  seats.onchange = () => amt.innerText = seats.value * 100;

  btn.onclick = () => {
    const email = document.getElementById("email").value;
    const amount = seats.value * 100;

    if (!email) {
      alert("Enter email");
      return;
    }

    fetch("https://YOUR-RENDER-BACKEND.onrender.com/create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        amount,
        email,
        phone: "9999999999"
      })
    })
    .then(res => res.json())
    .then(data => {

      if (!data.payment_session_id) {
        alert("Session failed");
        return;
      }

      cashfree.pay({
        paymentSessionId: data.payment_session_id,
        redirectTarget: "_top"   // 🔥 Netlify + Android SAFE
      });

    })
    .catch(() => alert("Payment failed"));
  };

});
</script>

</body>
</html>
