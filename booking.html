<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Tickets - DISTRICT MOVIE TICKET R </title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .booking-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
    }
    label {
      margin-top: 1rem;
      display: block;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      border: none;
      background: #333;
      color: #fff;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.8rem;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    .price {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #00ff99;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎟️ Book Your Ticket</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Support</a>
    </nav>
  </header>
<div class="booking-container">
  <h2 id="movieTitle">Movie</h2>

  <label>Select Date:</label>
  <input type="date" id="date" required />

  <label>Select Show Time:</label>
  <select id="showtime">
    <option value="9 AM">9 AM</option>
    <option value="12 PM">12 PM</option>
    <option value="3 PM">3 PM</option>
    <option value="6 PM">6 PM</option>
    <option value="9 PM">9 PM</option>
  </select>

  <label>Number of Seats:</label>
  <select id="seats">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>

  <label>Your Email:</label>
  <input type="email" id="email" />

  <div class="price">Total: ₹<span id="totalPrice">100</span></div>

  <button type="button" id="payBtn">Pay now</button>
</div>


  <footer>
    <p>&copy; 2025 DISTRICT MOVIE TICKET • All rights reserved</p>
  </footer>

<!-- Cashfree SDK -->
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<script>
  const cashfree = Cashfree({ mode: "production" }); // LIVE

  document.getElementById("payBtn").addEventListener("click", async function () {

    const movie = document.getElementById("movieTitle").innerText;
    const date = document.getElementById("date").value;
    const showtime = document.getElementById("showtime").value;
    const seats = parseInt(document.getElementById("seats").value);
    const email = document.getElementById("email").value;
    const amount = 100 * seats;

    if (!date || !email || !seats) {
      alert("Please fill all details");
      return;
    }

    try {
      const res = await fetch(
        "https://district-movie-ticket-r-backend-1.onrender.com/create-order",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            orderAmount: amount,
            customerEmail: email,
            customerName: "District Movie Ticket Customer",
            customerPhone: "9999999999",
            orderNote: `${movie} - ${showtime} (${date})`
          })
        }
      );

      const data = await res.json();
      console.log("Backend response:", data);

      if (!data.payment_session_id) {
        alert("❌ Payment session not created");
        return;
      }

      cashfree.pay({
        paymentSessionId: data.payment_session_id,
        redirectTarget: "_self"
      });

    } catch (err) {
      console.error(err);
      alert("Payment failed to start");
    }
  });
</script>
