<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Ticket Booking</title>

<style>
body {
  background:#111;
  color:#fff;
  font-family:Arial, sans-serif;
}
.box {
  max-width:420px;
  margin:40px auto;
  background:#1e1e1e;
  padding:20px;
  border-radius:8px;
}
input, select, button {
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:5px;
  border:none;
}
input, select {
  background:#333;
  color:#fff;
}
button {
  background:#e50914;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
.price {
  margin-top:10px;
  color:#00ff99;
}
</style>
</head>

<body>

<div class="box">
  <h2>🎟 Movie Ticket</h2>

  <input type="email" id="email" placeholder="Enter email">

  <select id="seats">
    <option value="1">1 Seat</option>
    <option value="2">2 Seats</option>
    <option value="3">3 Seats</option>
    <option value="4">4 Seats</option>
  </select>

  <div class="price">Total: ₹<span id="amount">100</span></div>

  <button id="payBtn">Pay Now</button>
</div>

<script>
const seats = document.getElementById("seats");
const amountEl = document.getElementById("amount");

seats.addEventListener("change", () => {
  amountEl.innerText = seats.value * 100;
});

document.getElementById("payBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const seatCount = parseInt(seats.value);
  const amount = seatCount * 100;

  if (!email) {
    alert("Enter email");
    return;
  }

  try {
    const res = await fetch(
      "https://district-movie-ticket-r-backend-1.onrender.com/create-order",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orderAmount: amount,
          customerEmail: email,
          customerName: "Movie Ticket Customer",
          customerPhone: "9999999999",
          orderNote: "Movie Ticket Booking"
        })
      }
    );

    const data = await res.json();
    console.log("BACKEND RESPONSE:", data);

    if (!data.payment_session_id || !data.order_id) {
      alert("Payment session not created");
      return;
    }

    // 🔥 PURANA WORKING REDIRECT (PAGE LOADS)
    window.location.href =
      "https://payments.cashfree.com/pg/orders/" +
      data.order_id +
      "?payment_session_id=" +
      data.payment_session_id;

  } catch (e) {
    console.error(e);
    alert("Payment failed to start");
  }
});
</script>

</body>
</html>
