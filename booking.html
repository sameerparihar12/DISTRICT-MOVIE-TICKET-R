<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Tickets - District Movie Ticket R</title>
  
  <!-- Cashfree SDK -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --text: #e0e0e0;
      --accent: #e50914;
      --success: #00ff99;
      --error: #ff4d4d;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 1.9rem;
    }

    .movie-title {
      text-align: center;
      margin-bottom: 20px;
      color: #ccc;
      font-size: 1.2rem;
      font-weight: 500;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229,9,20,0.2);
    }

    .total {
      margin: 20px 0;
      font-size: 1.4rem;
      text-align: center;
      color: var(--success);
    }

    #payBtn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #payBtn:hover:not(:disabled) {
      background: #b20710;
    }

    #payBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #loadingSpinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
    }

    .success { background: rgba(0,255,153,0.15); color: var(--success); }
    .error   { background: rgba(255,77,77,0.15);   color: var(--error); }

    .input-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-group > div {
      flex: 1;
      min-width: 180px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎟 Book Your Tickets</h2>

  <div class="movie-title" id="movieInfo"></div>

  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="Enter your full name" required />

  <div class="input-group">
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" required />
    </div>

    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit number" pattern="[0-9]{10}" required />
    </div>
  </div>

  <label for="seats">Number of Seats</label>
<select id="seats">
  <option value="1">1 Seat — ₹2342.20</option>
  <option value="2">2 Seats — ₹4684.40</option>
  <option value="3">3 Seats — ₹7026.60</option>
  <option value="4">4 Seats — ₹9368.80</option>
</select>

<div class="total">
  Total: ₹<span id="amount">2342.20</span>
</div>

  <button id="payBtn">
    <span id="btnText">Pay Now</span>
    <span id="loadingSpinner"></span>
  </button>

  <div id="message"></div>
</div>

<script>
// Show selected movie from URL
const params = new URLSearchParams(window.location.search);
const movie = decodeURIComponent(params.get("movie") || "Selected Movie");
document.getElementById("movieInfo").textContent = `Movie: ${movie}`;

// Update total amount
const seatsEl = document.getElementById("seats");
const amountEl = document.getElementById("amount");
const payBtn   = document.getElementById("payBtn");
const btnText  = document.getElementById("btnText");
const spinner  = document.getElementById("loadingSpinner");
const msgEl    = document.getElementById("message");

function updateAmount() {
  amountEl.textContent = seatsEl.value * 1399;
}
seatsEl.addEventListener("change", updateAmount);
updateAmount();

// Show message
function showMessage(text, type = "") {
  msgEl.textContent = text;
  msgEl.className = type;
  msgEl.style.display = text ? "block" : "none";
}

// Pay button click
payBtn.addEventListener("click", async () => {
  const name  = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();

  // Basic validation
  if (!name) {
    showMessage("Please enter your full name", "error");
    return;
  }
  if (!email || !email.includes("@")) {
    showMessage("Please enter a valid email address", "error");
    return;
  }
  if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
    showMessage("Please enter a valid 10-digit phone number", "error");
    return;
  }

  // Show loading state
  payBtn.disabled = true;
  btnText.textContent = "Processing...";
  spinner.style.display = "inline-block";
  showMessage("", "");

  try {
    const res = await fetch(
      "https://district-movie-ticket-r-backend-1.onrender.com/create-order",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orderAmount: Number(amountEl.textContent),
          customerName: name,
          customerEmail: email,
          customerPhone: phone,
          orderNote: `Tickets for ${movie} - ${seatsEl.value} seats`
        })
      }
    );

    const data = await res.json();

    if (!res.ok || !data.payment_session_id) {
      throw new Error(data.error || "Failed to create payment session. Please try again.");
    }

    // Launch Cashfree checkout
    const cashfree = Cashfree({
      mode: "production"
    });

    cashfree.checkout({
      paymentSessionId: data.payment_session_id,
      redirectTarget: "_self"
    });

  } catch (err) {
    console.error("Payment error:", err);
    showMessage("Payment setup failed: " + (err.message || "Unknown error"), "error");
  } finally {
    // Reset UI
    payBtn.disabled = false;
    btnText.textContent = "Pay Now";
    spinner.style.display = "none";
  }
});
</script>

</body>
</html>
