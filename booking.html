<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Tickets - DISTRICT MOVIE TICKET R</title>

  <style>
    body { background:#111; color:#fff; font-family: Arial, sans-serif; }
    .booking-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
    }
    label {
      margin-top: 1rem;
      display: block;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      border: none;
      background: #333;
      color: #fff;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.8rem;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    .price {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #00ff99;
    }
  </style>
</head>
<body>

<header style="text-align:center">
  <h1>🎟️ Book Your Ticket</h1>
</header>

<div class="booking-container">
  <h2 id="movieTitle">Movie</h2>

  <label>Select Date:</label>
  <input type="date" id="date" />

  <label>Select Show Time:</label>
  <select id="showtime">
    <option value="9 AM">9 AM</option>
    <option value="12 PM">12 PM</option>
    <option value="3 PM">3 PM</option>
    <option value="6 PM">6 PM</option>
    <option value="9 PM">9 PM</option>
  </select>

  <label>Number of Seats:</label>
  <select id="seats">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>

  <label>Your Email:</label>
  <input type="email" id="email" />

  <div class="price">Total: ₹<span id="totalPrice">100</span></div>

  <button id="payBtn">Pay now</button>
</div>

<footer style="text-align:center; margin-top:20px;">
  <p>&copy; 2025 DISTRICT MOVIE TICKET</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const payBtn = document.getElementById("payBtn");
  const seatsEl = document.getElementById("seats");
  const priceEl = document.getElementById("totalPrice");

  seatsEl.addEventListener("change", () => {
    priceEl.innerText = 100 * parseInt(seatsEl.value);
  });

  payBtn.addEventListener("click", function () {

    const movie = document.getElementById("movieTitle").innerText;
    const date = document.getElementById("date").value;
    const showtime = document.getElementById("showtime").value;
    const seats = parseInt(document.getElementById("seats").value);
    const email = document.getElementById("email").value;
    const amount = 100 * seats;

    if (!date || !email || !seats) {
      alert("Please fill all details");
      return;
    }

    fetch("https://district-movie-ticket-r-backend-1.onrender.com/create-order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        orderAmount: amount,
        customerEmail: email,
        customerName: "District Movie Ticket Customer",
        customerPhone: "9999999999",
        orderNote: `${movie} - ${showtime} (${date})`
      })
    })
    .then(res => res.json())
    .then(data => {
      console.log("Backend response:", data);

      if (!data.payment_session_id) {
        alert("Payment session not created");
        return;
      }

      // 🔥 CASHFREE JOD-TOD (NO SDK, GUARANTEED)
      const paymentUrl =
        "https://payments.cashfree.com/checkout/?session_id=" +
        data.payment_session_id;

      window.location.href = paymentUrl;
    })
    .catch(err => {
      console.error(err);
      alert("Payment failed to start");
    });
  });

});
</script>

</body>
</html>
