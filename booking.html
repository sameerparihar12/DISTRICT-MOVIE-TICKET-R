<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Movie Ticket</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #141e30, #243b55);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      background: #1f1f1f;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00ffc8;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      background: #2e2e2e;
      color: #fff;
    }

    .price {
      margin-top: 15px;
      text-align: center;
      color: #00ff99;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #e50914;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🎟️ Movie Ticket</h1>

  <label>Date</label>
  <input type="date" id="date">

  <label>Show Time</label>
  <select id="showtime">
    <option>9 AM</option>
    <option>12 PM</option>
    <option>3 PM</option>
    <option>6 PM</option>
    <option>9 PM</option>
  </select>

  <label>Seats</label>
  <select id="seats">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <div class="price">
    Total: ₹<span id="amount">100</span>
  </div>

  <button id="payBtn">Pay Now</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const seats = document.getElementById("seats");
  const amountEl = document.getElementById("amount");
  const payBtn = document.getElementById("payBtn");

  seats.addEventListener("change", () => {
    amountEl.innerText = seats.value * 100;
  });

  payBtn.addEventListener("click", () => {

    const date = document.getElementById("date").value;
    const email = document.getElementById("email").value;
    const seatCount = parseInt(seats.value);
    const amount = seatCount * 100;

    if (!date || !email) {
      alert("Please fill all details");
      return;
    }

    fetch("https://district-movie-ticket-r-backend-1.onrender.com/create-payment-link", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        amount: amount,
        email: email,
        phone: "9999999999"
      })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.link_url) {
        alert("Payment link failed");
        return;
      }
      window.location.href = data.link_url;
    })
    .catch(() => {
      alert("Payment failed to start");
    });
  });

});
</script>

</body>
</html>
